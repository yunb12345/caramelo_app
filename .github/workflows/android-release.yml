name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Install Android NDK
        run: yes | sdkmanager "ndk;27.1.12297006" > /dev/null

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "caramelo-${VERSION}.apk"
          ls -lh "caramelo-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caramelo-apk
          path: caramelo-*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Caramelo ${{ github.ref_name }}
          body: |
            APK de **Caramelo ${{ github.ref_name }}** para Android.

            ### Instalación
            1. Descargá el archivo `.apk` adjunto.
            2. En Android, permití la instalación de apps de origen desconocido.
            3. Instalá el APK y abrí Caramelo.
            4. En la pantalla de inicio de sesión, tocá **Servidor** e ingresá la URL de la API
               (por ejemplo `http://192.168.0.10:3001/api`).

            ### Notas
            - El APK está firmado con la clave de desarrollo de Expo: sirve para instalar
              directamente, pero no para publicar en Google Play.
            - La app necesita una API de Caramelo accesible desde el teléfono.
            - Credenciales por defecto del seed: `admin@caramelo.local` / `caramelo123`.
          files: caramelo-*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
